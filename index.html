<!DOCTYPE html>
<html>
<head>
<title>CampusConnect</title>
<link rel="stylesheet" href="style.css">

<style>
body{
  margin:0;
  background:#0b1220;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Segoe UI;
}

.container{
  width:380px;
  background:#0f172a;
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
  text-align:center;
}

h1{
  color:#3b82f6;
  margin-bottom:10px;
}

p{
  color:#cbd5e1;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #1f2937;
  background:#0b1220;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#3b82f6;
  border:none;
  color:white;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#2563eb;
}

.small{
  font-size:12px;
  color:#94a3b8;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>CampusConnect 💬</h1>
  <p>Smart Campus Communication SaaS</p>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p class="small">Connect with students in real time 🚀</p>
</div>

<script type="module">

import { auth } from "./firebase.js";
import {
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔐 AUTO REDIRECT IF LOGGED IN */
onAuthStateChanged(auth,(user)=>{
  if(user){
    window.location.href="dashboard.html";
  }
});

/* 🔥 LOGIN */
window.login = function(){

  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth,email,password)
  .then(()=>{
    window.location.href="dashboard.html";
  })
  .catch(err=>{
    alert("Login failed: " + err.message);
  });

}
</script>

</body>
</html>
