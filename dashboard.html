<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">

<style>
/* small SaaS upgrade touches */
body{
  background:#0b1220;
}

.fade-in{
  animation:fade 0.6s ease-in;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.user-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.badge{
  background:#3b82f6;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
}

</style>
</head>

<body>

<div class="sidebar">
  <h2>CampusConnect</h2>

  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="chat.html">💬 Chat</a>
  <a href="groups.html">👥 Groups</a>
  <a href="announcements.html">📢 Announcements</a>

  <button onclick="logout()">🚪 Logout</button>
</div>

<div class="main fade-in">

<div class="topbar glass">
  <h3 id="welcome">Loading...</h3>
</div>

<div class="card user-card glass">
  <div>
    <h3 id="email">User</h3>
    <p>Campus Member</p>
  </div>
  <div class="badge">Online 🟢</div>
</div>

<div class="card glass">
  <h3>Quick Actions</h3>
  <button onclick="go('chat.html')">Open Chat</button>
  <button onclick="go('groups.html')">Open Groups</button>
</div>

<div class="card glass">
  <h3>System Status</h3>
  <p>All systems running ✅</p>
</div>

</div>

<script type="module">

import { auth } from "./firebase.js";
import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔐 AUTH GUARD */
onAuthStateChanged(auth,(user)=>{
  if(!user){
    window.location.href="index.html";
  }else{
    document.getElementById("welcome").innerText =
      "Welcome " + user.email + " 👋";

    document.getElementById("email").innerText =
      user.email;
  }
});

/* 🚪 LOGOUT */
window.logout = function(){
  signOut(auth).then(()=>{
    window.location.href="index.html";
  });
}

/* NAV */
window.go = function(page){
  window.location.href = page;
}

</script>

</body>
</html>
